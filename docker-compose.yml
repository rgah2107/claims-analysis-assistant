# Full demo stack. No API keys: the API and the worker use the fake providers.
# The API and the worker share the uploads volume because the worker reads the
# bytes the API just stored. Postgres is the pgvector image, which is also the
# image the integration tests start themselves.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://claims:claims@postgres:5432/claims
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      OTEL_EXPORTER: console
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - uploads:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.tasks:celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://claims:claims@postgres:5432/claims
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      OTEL_EXPORTER: console
    volumes:
      - uploads:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
